<nav
  class="flex justify-between items-center p-4 sticky top-0 left-0 right-0 z-50 backdrop-blur-md border-b-slate-600 border-b-2"
>
  <div
    class="mono text-center text-2xl m-2 w-full md:w-auto pointer-events-none"
  >
    <b> {{ displayText }}<span class="animate-pulse">|</span> </b>
  </div>
  <div class="flex gap-4">
    <ul
      class="flex flex-wrap font-mono font-light text-[#fff9ec] tracking-wide gap-8 justify-center md:text-lg"
    >
      @for (item of items; track item.id) {
        <li>
          <a [routerLink]="[]" [fragment]="item.fragment">{{
            item.name | translate
          }}</a>
        </li>
      }
      <li>
        <a [routerLink]="[]" fragment="knowledges">{{
          "navbar.knowledges" | translate
        }}</a>
      </li>
    </ul>
    <ul>
      <li class="flex gap-4">
        <!-- <p-speeddial
          [model]="flags"
          direction="up"
          [style]="{
            position: 'absolute',
            left: 'calc(50% - 2rem)',
            bottom: 0,
          }"
        /> -->

        <div>
          <button (click)="changeLang('pt')">
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/0/05/Flag_of_Brazil.svg"
              alt="Portuguese Flag"
              class="w-6 h-4"
            />
          </button>
        </div>
        <div>
          <button (click)="changeLang('en')">
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/1/17/Flag_of_the_United_States_%28US_Government_Printing_Office_specifications%29.svg"
              alt="English Flag"
              class="w-6 h-4"
            />
          </button>
        </div>
      </li>
    </ul>
  </div>
</nav>
