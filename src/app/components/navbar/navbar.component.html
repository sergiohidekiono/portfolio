<nav
  class="md:flex justify-between items-center p-4 sticky top-0 left-0 right-0 z-50 backdrop-blur-md border-b-gray-700 border-b-2 mix-blend-difference"
>
  <div class="flex">
    <app-language class="flex md:hidden items-center" />
    <div
      class="mono text-center font-extrabold text-xl md:text-3xl m-2 w-full md:w-auto pointer-events-none"
    >
      <b> {{ displayText }}<span class="animate-pulse">|</span> </b>
    </div>
    <p-button
      (click)="isDrawerVisible = !isDrawerVisible"
      [text]="true"
      class="md:hidden flex items-center"
    >
      <span class="pi pi-bars text-white"></span>
    </p-button>
    <p-drawer header="Menu" [(visible)]="isDrawerVisible" position="right">
      <hr class="mb-4 border-t border-0 border-surface" />
      <div class="font-mono font-extrabold text-lg">
        @for (item of items; track item.id) {
          <div class="mt-4">
            <a
              [routerLink]="[]"
              [fragment]="item.fragment"
              (click)="isDrawerVisible = false"
              >{{ item.name | translate }}</a
            >
          </div>
        }
      </div>
    </p-drawer>
  </div>
  <div class="hidden md:flex gap-4">
    <ul
      class="flex flex-wrap font-mono font-extrabold text-[#fff9ec] mt-5 md:mt-0 tracking-wide gap-6 md:gap-8 justify-center md:text-xl"
    >
      @for (item of items; track item.id) {
        <li>
          <a [routerLink]="[]" [fragment]="item.fragment">{{
            item.name | translate
          }}</a>
        </li>
      }
      <li>
        <a [routerLink]="[]" fragment="knowledges">{{
          "navbar.knowledges" | translate
        }}</a>
      </li>
    </ul>
    <app-language class="hidden md:flex md:items-center" />
  </div>
</nav>

<p-scrolltop
  icon="pi pi-arrow-up"
  [buttonProps]="{ severity: 'secondary', raised: true, rounded: true }"
/>
